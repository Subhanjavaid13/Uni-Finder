# 2) RSS feeds from scholarship news sites: global discovery, free, no API key.
rss_feeds:
  - name: "Scholars4Dev"
    url: "https://www.scholars4dev.com/feed/"
  - name: "Opportunity Desk"
    url: "https://opportunitydesk.org/feed/"
  - name: "Opportunities For Youth"
    url: "https://opportunitiesforyouth.org/feed/"
  - name: "Scholarship Positions"
    url: "https://scholarship-positions.com/feed/"
  - name: "Greatyop"
    url: "https://greatyop.com/feed/"

# 3) Web search: finds universities and scholarships that are not in any list above.
#    {field}, {year} and {country} are filled in automatically. Countries rotate each
#    week so the whole world gets covered over time without hitting free-tier limits.
search:
  enabled: true
  max_results_per_query: 8
  queries_per_run: 12
  countries_per_run: 6
  queries:
    - "fully funded masters {field} scholarship {year} international students"
    - "{field} masters scholarship {year} stipend accommodation no application fee"
    - "masters {field} scholarship {year} no IELTS medium of instruction accepted"
    - "fully funded {field} masters scholarship for Pakistani students {year}"
  country_queries:
    - "fully funded masters scholarship {country} {year} international students {field}"
  countries:
    - Germany
    - Netherlands
    - Belgium
    - France
    - Italy
    - Spain
    - Portugal
    - Austria
    - Switzerland
    - Sweden
    - Finland
    - Norway
    - Denmark
    - Ireland
    - Poland
    - Czech Republic
    - Hungary
    - Estonia
    - United Kingdom
    - Turkey
    - South Korea
    - Japan
    - China
    - Taiwan
    - Hong Kong
    - Singapore
    - Malaysia
    - Brunei
    - Saudi Arabia
    - United Arab Emirates
    - Qatar
    - United States
    - Canada
    - Australia
    - New Zealand

# Cheap keyword filter applied BEFORE spending AI calls on a page.
# A page must contain at least one word from each list.
relevance_keywords:
  funding: ["scholarship", "fully funded", "fully-funded", "stipend", "fellowship", "tuition waiver", "grant"]
  level: ["master", "msc", "m.sc", "postgraduate", "graduate", "ms "]
