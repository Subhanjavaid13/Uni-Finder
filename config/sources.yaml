# ------------------------------------------------------------------
# WHERE THE AGENT LOOKS. Add or remove sources freely.
# Run `python -m scholar_radar check-sources` to test every URL.
# ------------------------------------------------------------------

# 1) Official scholarship pages. The agent saves a fingerprint of each page and
#    only re-analyses it with AI when the page content changes (e.g. "applications open").
#    seed_key: links the page to an entry in scholarships_seed.yaml so real dates replace estimates.
#    follow_links: also analyse links on the page whose text contains these words.
official_pages:
  - name: "Erasmus Mundus Catalogue"
    url: "https://www.eacea.ec.europa.eu/scholarships/erasmus-mundus-catalogue_en"
    country: "European Union"
    seed_key: "erasmus_mundus"
    follow_links: ["artificial intelligence", "computer", "data science", "machine learning", "informatics", "software", "cyber"]
  - name: "DAAD Scholarship Database"
    url: "https://www2.daad.de/deutschland/stipendium/datenbank/en/21148-scholarship-database/"
