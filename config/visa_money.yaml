- country: Finland
  visa_type: First residence permit for studies (Migri)
  proof_of_funds: EUR 800 per month; for studies of one year or longer EUR 9,600 in own bank account (sole
    owner) at time of application. EUR 270/month if institution provides free accommodation and meals.
    Plus private health insurance.
  bank_statement: Yes - EUR 9,600 in an account you solely own; not needed if your scholarship fully covers
    living costs.
  scholarship_letter_accepted: 'yes'
  visa_fee: null
  notes: Apply via Studyinfo.fi joint application (most universities 7-21 Jan 2027; Helsinki 5-19 Jan
    2027; LUT rolling 1 Oct 2026 - 31 Mar 2027). After admission apply for residence permit online (Enter
