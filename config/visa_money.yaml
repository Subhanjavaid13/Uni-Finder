- country: Denmark
  visa_type: Residence permit for higher educational programmes (SIRI, form ST1)
  proof_of_funds: DKK 7,426 per month (2026 level), capped at DKK 89,112 for studies over one year. Bank
    statement in own name dated within 30 days; funds in parents' names or stocks/bonds not accepted.
    Not required if paid tuition covers room and board.
  bank_statement: Yes - statement in your own name dated within the last 30 days (a parent's account is
    not accepted), unless a scholarship covers the monthly amount.
  scholarship_letter_accepted: 'yes'
  visa_fee: DKK 3,060
  notes: After admission, pay fee and submit ST1 online, then give biometrics (photo + fingerprints) within
    14 days at the Danish Embassy in Islamabad or VFS centre. Processing ~2 months (3 if more info needed).
  source: https://www.nyidanmark.dk/en-GB/You-want-to-apply/Study/Higher-Education
- country: Estonia
  visa_type: Long-term D visa, then temporary residence permit (TRP) for study from Police and Border
