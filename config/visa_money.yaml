    documents.
  bank_statement: Yes - about 3 months of bank statements, or parental/scholarship documentation.
  scholarship_letter_accepted: 'yes'
  visa_fee: D visa EUR 120; TRP EUR 225
  notes: 'No Estonian embassy in Pakistan: apply for the D visa via VFS Global (where available) or travel
    to the nearest Estonian embassy (own responsibility). After arrival book a PPA service office appointment
    for the TRP (decision within 2 months).'
