name: ScholarRadar weekly

on:
  schedule:
    - cron: "0 4 * * 1" # every Monday 04:00 UTC = 09:00 Pakistan time
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build the report but don't email or save memory)"
        type: boolean
        default: false

permissions:
  contents: write # lets the job commit the agent's memory (data/state.json)

concurrency:
  group: scholar-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m scholar_radar --verbose run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scholar-radar-report
          path: output/
          if-no-files-found: ignore

      - name: Save agent memory
        if: always() # the agent saves its state before emailing, so keep it even if a step failed
        run: |
          if [ -f data/state.json ]; then
            git config user.name "scholar-radar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: update radar memory [skip ci]"
              git pull --rebase --autostash origin ${{ github.ref_name }} || true
              git push origin HEAD:${{ github.ref_name }}
            fi
          fi

  tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
